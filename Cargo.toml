[package]
name = "wezterm-agents"
version = "0.1.0"
edition = "2021"
description = "WezTerm 上のAIエージェントを一覧・監視・ジャンプするTUI"

[dependencies]
# crossterm は ratatui が再エクスポートするものを使う（ratatui::crossterm）。
# 直接依存として別途バージョン指定すると、型が食い違う典型的な事故になる。
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# getuid(2) / isatty(3) / O_NOFOLLOW のためだけに使う。std には無く、
# 状態ディレクトリの所有者検証（paths.rs）はこれ無しには書けない。
# crossterm 経由で既に依存ツリーに入っているので、直接依存にしても
# ビルド時間もバイナリサイズも増えない。
libc = "0.2"

[profile.release]
# 実測でコールドビルド20秒。opt-level=3 まで上げる理由がない
# （ボトルネックは wezterm cli のサブプロセス起動であってCPUではない）。
opt-level = 2
